version: "3.8"

services:
  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER:  ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"

  app:
    image: carbon-routing-app
    build: demo
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - .env